name: Publish

# semantic-release picks the next version from the conventional commits on master, tags it,
# creates the GitHub release, and stages the package on npm via trusted publishing (OIDC): no
# npm token is stored in the repo. The release goes live only once a maintainer approves it
# with 2FA (npm stage approve <id>, or the Staged Packages tab on npmjs.com).
# Configure the trusted publisher on npmjs.com with workflow filename "publish.yml".
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the full history and tags
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
